name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm instead of running a package dry run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NODE_VERSION: 24

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare publish metadata
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const packagePath = 'packages/analog-ui/package.json';
          const packageJson = JSON.parse(readFileSync(packagePath, 'utf8'));
          const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const isManualPublish =
            process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            process.env.PUBLISH_REQUESTED === 'true';

          if (isManualPublish && process.env.GITHUB_REF_NAME !== process.env.GITHUB_DEFAULT_BRANCH) {
            throw new Error(
              `Manual npm publish must run from "${process.env.GITHUB_DEFAULT_BRANCH}", received "${process.env.GITHUB_REF_NAME}".`,
            );
          }

          if (process.env.GITHUB_EVENT_NAME === 'release') {
            const allowedTags = [
              packageJson.version,
              `v${packageJson.version}`,
              `${packageJson.name}@${packageJson.version}`,
            ];

            if (!allowedTags.includes(process.env.GITHUB_REF_NAME)) {
              throw new Error(
                `Release tag "${process.env.GITHUB_REF_NAME}" does not match package version "${packageJson.version}".`,
              );
            }
          }

          const repository =
            typeof packageJson.repository === 'string'
              ? { type: 'git', url: packageJson.repository }
              : (packageJson.repository ?? {});

          packageJson.repository = {
            type: repository.type ?? 'git',
            url: repository.url ?? `git+${repositoryUrl}.git`,
            directory: repository.directory ?? 'packages/analog-ui',
          };
          packageJson.bugs ??= { url: `${repositoryUrl}/issues` };
          packageJson.homepage ??= `${repositoryUrl}#readme`;
          packageJson.publishConfig = {
            ...packageJson.publishConfig,
            access: 'public',
          };
          delete packageJson.publishConfig.provenance;

          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          JS

      - name: Verify publish artifact
        run: pnpm --filter analog-ui publish:check

      - name: Publish to npm with provenance
        if: (github.event_name == 'release' || inputs.publish) && !github.event.repository.private
        run: pnpm --filter analog-ui publish --access public --provenance --no-git-checks

      - name: Publish to npm
        if: (github.event_name == 'release' || inputs.publish) && github.event.repository.private
        run: pnpm --filter analog-ui publish --access public --no-git-checks
